<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>แม่บ้าน Maebaan · Home Inventory</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        background: #e7dff3;
        font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
      }
      * {
        -webkit-tap-highlight-color: transparent;
        box-sizing: border-box;
      }
      input,
      button,
      select {
        font-family: inherit;
      }
      input:focus,
      select:focus {
        outline: none;
      }
      ::-webkit-scrollbar {
        width: 0;
        height: 0;
      }
      [data-scroll]::-webkit-scrollbar {
        width: 6px;
      }
      [data-scroll]::-webkit-scrollbar-thumb {
        background: #c6b9e6;
        border-radius: 99px;
      }
      [data-scroll]::-webkit-scrollbar-track {
        background: rgba(120, 95, 175, 0.1);
        border-radius: 99px;
      }
      @keyframes clayIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes clayUp {
        from {
          transform: translateY(105%);
        }
        to {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
